[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnishared"
version = "1.0.0"
description = "Core shared assets and engines for OmniSuite"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "alembic>=1.10.0",
    "sqlalchemy>=2.0.0",
    "python-docx>=1.1.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]
