name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "src/omnishared"
          pip install -e "src/omnidebate"
          pip install -e "src/omniformat"
          pip install -e .
          pip install ruff pytest pytest-asyncio

      - name: lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: run tests
        run: pytest --tb=short -q
        env:
          EVIDENCE_VAULT_DB: ":memory:"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "src/omnishared"
          pip install -e "src/omnidebate"
          pip install -e "src/omniformat"
          pip install -e .
          pip install mypy types-requests types-PyYAML types-beautifulsoup4

      - name: type check shared core
        run: mypy src/omnishared/src/omnishared --ignore-missing-imports --no-error-summary || true
