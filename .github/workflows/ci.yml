name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Fast Offline Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate YAML Files
        run: |
          ruby -ryaml -e '
            Dir.glob(".github/**/*.{yml,yaml}").each do |f|
              YAML.safe_load(File.read(f))
              puts "Validated: #{f}"
            end
          '

      - name: Verify Lowercase Filenames
        run: |
          if git ls-files | grep -v '^CNAME$' | grep '[A-Z]'; then
            echo "Error: uppercase tracked files found"
            exit 1
          fi
          echo "All tracked files are lowercase."

      - name: Verify Commit Message Conventions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -c '
          import subprocess, re, os
          pattern = re.compile(r"^[a-z]+: [a-z0-9]+ [a-z0-9]+ [a-z0-9]+$")
          base_sha = os.environ.get("BASE_SHA", "")

          if base_sha and not re.match(r"^0+$", base_sha):
              rev_range = f"{base_sha}..HEAD"
          else:
              rev_range = "HEAD~1..HEAD"

          try:
              commits = subprocess.check_output(["git", "log", rev_range, "--format=%H %s"]).decode().strip().split("\n")
          except Exception:
              commits = subprocess.check_output(["git", "log", "-1", "--format=%H %s"]).decode().strip().split("\n")

          commits = [c for c in commits if c.strip()]
          for c in commits:
              sha, msg = c.split(" ", 1)
              if msg.startswith("Merge "):
                  continue
              if not pattern.match(msg):
                  raise SystemExit(f"Invalid commit message {sha[:7]}: {msg}")
          print(f"Validated {len(commits)} commit messages.")
          '

  test:
    runs-on: ${{ matrix.os }}
    needs: [ quality ]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "src/omnishared"
          pip install -e "src/omnidebate"
          pip install -e "src/omniformat"
          pip install -e .
          pip install ruff pytest pytest-asyncio

      - name: Lint With Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Tests
        run: pytest --tb=short -q
        env:
          EVIDENCE_VAULT_DB: ":memory:"

  typecheck:
    runs-on: ubuntu-latest
    needs: [ quality ]
    steps:
      - uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "src/omnishared"
          pip install -e "src/omnidebate"
          pip install -e "src/omniformat"
          pip install -e .
          pip install mypy types-requests types-PyYAML types-beautifulsoup4

      - name: Type Check Shared Core
        continue-on-error: true
        run: mypy src/omnishared/src/omnishared --ignore-missing-imports --no-error-summary
