name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "src/omnishared"
          pip install -e "src/omnidebate"
          pip install -e "src/omniformat"
          pip install -e .
          pip install ruff pytest pytest-asyncio

      - name: Lint With Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Tests
        run: pytest --tb=short -q
        env:
          EVIDENCE_VAULT_DB: ":memory:"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "src/omnishared"
          pip install -e "src/omnidebate"
          pip install -e "src/omniformat"
          pip install -e .
          pip install mypy types-requests types-PyYAML types-beautifulsoup4

      - name: Type Check Shared Core
        continue-on-error: true
        run: mypy src/omnishared/src/omnishared --ignore-missing-imports --no-error-summary
